name: TechHaven DB Backup

on:
  schedule:
    - cron: '0 17 * * *' # Chạy lúc 0h sáng giờ VN (17h UTC) hàng ngày
  workflow_dispatch:      # Cho phép chạy thủ công

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Dump Database
        env:
          # Mapping các secret vào biến môi trường để dùng bên dưới
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # SỬA ĐỔI QUAN TRỌNG:
          # 1. -U: Đổi từ 'postgres' sang biến ${{ secrets.DB_USER }}
          # 2. -p: Đã đổi sang 6543 (IPv4 Pooler)
          # 3. Thêm --no-owner --no-acl: Giúp tránh lỗi quyền khi restore sang DB khác sau này (rất nên dùng với Supabase)
          
          pg_dump -h ${{ secrets.DB_HOST }} \
                  -U ${{ secrets.DB_USER }} \
                  -d ${{ secrets.DB_NAME }} \
                  -p 6543 \
                  --no-owner --no-acl \
                  --clean --if-exists \
                  > techhaven_backup.sql

      - name: Upload Backup to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: techhaven_backup.sql
          retention-days: 7
