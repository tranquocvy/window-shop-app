name: TechHaven CI/CD Pipeline

# 1. EVENT: Khi nào thì chạy?
on:
  push:
    branches: [ "cicd" ] # Chạy khi có code push vào nhánh main
  pull_request:
    branches: [ "cicd" ] # Chạy khi có ai đó tạo Pull Request vào main

# 2. JOBS: Các công việc cần làm
jobs:
  build-backend:
    name: Build ASP.NET Core
    runs-on: ubuntu-latest

    steps:
    # 1. Lấy code về
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Cài đặt .NET SDK 8.0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 3. Khôi phục thư viện (Restore)
    # LƯU Ý: Chỉ restore cho WebAPI để tránh lỗi WinUI trên Linux
    - name: Restore Dependencies
      run: dotnet restore TechHaven/TechHaven.Presentation.WebAPI/TechHaven.Presentation.WebAPI.csproj

    # 4. Build Code (Biên dịch)
    # --no-restore: Tận dụng kết quả bước trên
    # -c Release: Build cấu hình tối ưu cho production
    - name: Build WebAPI
      run: dotnet build TechHaven/TechHaven.Presentation.WebAPI/TechHaven.Presentation.WebAPI.csproj --no-restore -c Release

    # 5. Chạy Unit Test (Optional)
    # Nếu bạn chưa viết test, bước này có thể bỏ qua hoặc comment lại.
    # Tuy nhiên, tôi để sẵn mẫu ở đây. Nếu bạn có project test, hãy trỏ vào nó.
    # - name: Run Unit Tests
    #   run: dotnet test TechHaven.Tests/TechHaven.Tests.csproj --no-build -c Release