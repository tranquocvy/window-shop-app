name: TechHaven CI/CD Pipeline

# 1. EVENT: Khi nào thì chạy?
on:
  push:
    branches: [ "cicd" ] # Chạy khi có code push vào nhánh main
  pull_request:
    branches: [ "cicd" ] # Chạy khi có ai đó tạo Pull Request vào main

# 2. JOBS: Các công việc cần làm
jobs:
  build-backend:
    name: Build ASP.NET Core
    runs-on: ubuntu-latest
    # Chỉ chạy job này nếu là push lên nhánh main
    if: github.ref == 'refs/heads/cicd'

    steps:
    # 1. Lấy code về
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Cài đặt .NET SDK 8.0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 3. Khôi phục thư viện (Restore)
    # LƯU Ý: Chỉ restore cho WebAPI để tránh lỗi WinUI trên Linux
    - name: Restore Dependencies
      run: dotnet restore TechHaven/TechHaven.Presentation.WebAPI/TechHaven.Presentation.WebAPI.csproj

    # 4. Build Code (Biên dịch)
    # --no-restore: Tận dụng kết quả bước trên
    # -c Release: Build cấu hình tối ưu cho production
    - name: Build WebAPI
      run: dotnet build TechHaven/TechHaven.Presentation.WebAPI/TechHaven.Presentation.WebAPI.csproj --no-restore -c Release

    # 5. Chạy Unit Test (Optional)
    # Nếu bạn chưa viết test, bước này có thể bỏ qua hoặc comment lại.
    # Tuy nhiên, tôi để sẵn mẫu ở đây. Nếu bạn có project test, hãy trỏ vào nó.
    # - name: Run Unit Tests
    #   run: dotnet test TechHaven.Tests/TechHaven.Tests.csproj --no-build -c Release
  
  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Chỉ chạy job này SAU KHI job build-backend thành công VÀ là push lên nhánh main
    needs: build-backend
    if: github.ref == 'refs/heads/cicd' && needs.build-backend.result == 'success'

    steps:
      # 1. Lấy code về
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Đăng nhập Docker Hub
      # Sử dụng action 'docker/login-action' để đăng nhập an toàn bằng secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build và Push Docker Image
      # Sử dụng action 'docker/build-push-action' để thực hiện cả 2 việc
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./TechHaven # Build từ thư mục gốc của repo
          file: ./TechHaven/Dockerfile # Sử dụng Dockerfile này
          push: true # Đẩy lên registry sau khi build
          tags: | # Đặt các tag cho image
            ${{ secrets.DOCKERHUB_USERNAME }}/techhaven-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/techhaven-backend:v1.2